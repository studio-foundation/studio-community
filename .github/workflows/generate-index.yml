name: Generate index.json

on:
  push:
    branches: [main]
    paths:
      - '*/*/metadata.json'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate index.json
        run: node scripts/generate-index.mjs

      # main only accepts changes through a PR, so the index goes out on a branch.
      # The branch is rebuilt from main on every run, hence the force push.
      - name: Open a PR if the index changed
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/regenerate-index
        run: |
          # generated_at changes on every run, so it must not count as a change.
          [ -z "$(git diff -I'"generated_at"' index.json)" ] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add index.json
          git commit -m "chore: regenerate index.json"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "[registry] regenerate index.json" \
              --body "Regenerated by the Generate index.json workflow after a metadata.json change."
          fi
