name: budget-plan
version: 1
schema:
  required_fields:
    - total_budget_cents
    - categories
    - summary
  fields:
    categories:
      type: array
      items:
        type: object
        required_fields:
          - name
          - limit_cents
          - rationale
tool_calls:
  minimum: 1
  required_tools:
    - repo_manager.read_file
